[project]
name = "eval-qc-env"
version = "0.1.0"
description = "30 synthetic tool-use tasks (support tickets, data QC, retrieval) with deterministic code rewards, from eval-qc-harness."
requires-python = ">=3.11"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_qc_env"]
